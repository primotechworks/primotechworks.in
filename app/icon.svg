<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="pe-silver" x1="30" y1="10" x2="170" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#dfe4ea"/>
      <stop offset=".7" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#b8c1cc"/>
    </linearGradient>
    <linearGradient id="pe-band" x1="40" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3f5f8"/>
      <stop offset=".5" stop-color="#c9d1db"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <linearGradient id="pe-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f4a5e"/>
      <stop offset="1" stop-color="#062431"/>
    </linearGradient>
    <radialGradient id="pe-core" cx="100" cy="92" r="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#f1f4f8"/>
      <stop offset="1" stop-color="#d5dce5"/>
    </radialGradient>
    <linearGradient id="pe-blue" x1="100" y1="54" x2="100" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a9bff"/>
      <stop offset=".55" stop-color="#1668ea"/>
      <stop offset="1" stop-color="#0d4fc4"/>
    </linearGradient>
    <radialGradient id="pe-node" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#cfe6ff"/>
      <stop offset="1" stop-color="#6fb6ff"/>
    </radialGradient>
  </defs>

  <!-- Outer metallic rim with blue edge -->
  <circle cx="100" cy="100" r="97" fill="url(#pe-silver)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#9aa6b4" stroke-width="1"/>
  <circle cx="100" cy="100" r="91.5" fill="none" stroke="#1a6df0" stroke-width="2.6"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".9"/>

  <!-- Segmented band: silver (top-left, bottom-right) and teal (top-right, bottom-left) -->
  <circle cx="100" cy="100" r="87.5" fill="url(#pe-band)"/>
  <path d="M100 13.5A86.5 86.5 0 0 1 186.5 100H158A58 58 0 0 0 100 42Z" fill="url(#pe-teal)"/>
  <path d="M100 186.5A86.5 86.5 0 0 1 13.5 100H42A58 58 0 0 0 100 158Z" fill="url(#pe-teal)"/>
  <!-- glowing cyan arcs on the teal panels -->
  <g fill="none" stroke-linecap="round">
    <path d="M106 22A78 78 0 0 1 178 94" stroke="#22d3ee" stroke-width="2.4"/>
    <path d="M108 31A69 69 0 0 1 169 92" stroke="#67e8f9" stroke-width="1.2" opacity=".8"/>
    <path d="M94 178A78 78 0 0 1 22 106" stroke="#22d3ee" stroke-width="2.4"/>
    <path d="M92 169A69 69 0 0 1 31 108" stroke="#67e8f9" stroke-width="1.2" opacity=".8"/>
  </g>
  <!-- fine engraved detail on the silver panels -->
  <g fill="none" stroke="#97a3b3" stroke-width=".9" stroke-linecap="round" opacity=".85">
    <path d="M25 92A76 76 0 0 1 92 25"/>
    <path d="M33 92A68 68 0 0 1 92 33"/>
    <path d="M175 108A76 76 0 0 1 108 175"/>
    <path d="M167 108A68 68 0 0 1 108 167"/>
    <path d="M30 70h9M40 52l6 5M70 30l5 7"/>
    <path d="M170 130h-9M160 148l-6-5M130 170l-5-7"/>
  </g>
  <!-- panel seams -->
  <g stroke="#ffffff" stroke-width="2.4">
    <path d="M100 12v30M100 158v30M12 100h30M158 100h30"/>
  </g>
  <g stroke="#8794a5" stroke-width=".8">
    <path d="M101.4 12v30M98.6 158v30M12 101.4h30M158 98.6h30"/>
  </g>

  <!-- Inner bezel and white core -->
  <circle cx="100" cy="100" r="60" fill="#c3ccd7"/>
  <circle cx="100" cy="100" r="58" fill="url(#pe-core)"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#ffffff" stroke-width="1.4"/>

  <g transform="translate(100 98) scale(1.14) translate(-100 -98)">
  <!-- Upward chevron -->
  <path d="M66 89 100 56l34 33v11l-34-33-34 33Z" fill="url(#pe-blue)"/>
  <!-- House with keyhole doorway -->
  <path fill="url(#pe-blue)" fill-rule="evenodd"
        d="M100 73 116 89v19H84V89Z M97 108V95.5a3 3 0 0 1 6 0V108Z"/>

  <!-- Circuit traces fanning out from the house -->
  <g fill="none" stroke="url(#pe-blue)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M85 99 64 117"/>
    <path d="M115 99 136 117"/>
    <path d="M87 106v3l-14 15"/>
    <path d="M113 106v3l14 15"/>
    <path d="M91 108v8l-8 14"/>
    <path d="M109 108v8l8 14"/>
    <path d="M95 108v10l-3 9"/>
    <path d="M105 108v10l3 9"/>
    <path d="M100 104v31"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="url(#pe-node)" stroke="#1668ea" stroke-width="2">
    <circle cx="62" cy="119" r="3.9"/>
    <circle cx="138" cy="119" r="3.9"/>
    <circle cx="71" cy="126.5" r="3.9"/>
    <circle cx="129" cy="126.5" r="3.9"/>
    <circle cx="82" cy="132.5" r="3.9"/>
    <circle cx="118" cy="132.5" r="3.9"/>
    <circle cx="91.5" cy="129.5" r="3.6"/>
    <circle cx="108.5" cy="129.5" r="3.6"/>
    <circle cx="100" cy="138" r="3.9"/>
  </g>
  </g>
</svg>
